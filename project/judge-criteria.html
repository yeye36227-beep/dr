<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 구매 기준 카드</title>
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="tabs.css" />
    <link rel="stylesheet" href="judge.css" />
    <link rel="stylesheet" href="mypage.css" />
    <link rel="stylesheet" href="result.css" />
  </head>
  <body>
    <div class="app tabpage resultpage">
      <header class="subhead">
        <a href="./judge-result.html" class="subhead__back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 5-7 7 7 7" />
          </svg>
        </a>
        <h1 class="subhead__title">구매 기준 카드</h1>
      </header>

      <div class="scroll-area">
        <section class="result2">
          <h2 class="sect__title">구매 기준</h2>
          <p class="sect__body">제품 선택 시 확인할 사항을 정리했어요.</p>

          <div id="criteriaList" style="margin-top: 14px"></div>
        </section>
      </div>

      <div class="pagecta">
        <a href="./judge-result.html" class="btn btn--lg btn--primary">판정 결과로 돌아가기</a>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="data.js"></script>
    <script>
      document.getElementById('criteriaList').innerHTML = BUY_CRITERIA.map(
        (g) => `
        <section class="sect">
          <h2 class="sect__title">${g.title}</h2>
          <div class="sect__card">
            <dl class="deflist">
              ${g.items.map(([t, d], i) => `<dt>${i + 1}. ${t}</dt><dd>${d}</dd>`).join('')}
            </dl>
          </div>
        </section>`,
      ).join('');
    </script>
  </body>
</html>
