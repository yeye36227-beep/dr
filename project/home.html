<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 홈</title>
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="feed.css" />
    <link rel="stylesheet" href="mypage.css" />
  </head>
  <body>
    <div class="app home">

      <div class="scroll-area" id="homeScroll">
        <!-- 1. 검색 바 -->
        <div class="searchbar" id="searchbar">
          <button class="searchbar__icon" id="searchIcon" aria-label="검색">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="11" cy="11" r="6.5" />
              <path d="m16 16 4.5 4.5" />
            </svg>
          </button>
          <input
            type="search"
            class="searchbar__input"
            id="searchInput"
            placeholder="궁금한 건강 정보를 검색해 보세요"
          />
          <button
            class="searchbar__clear"
            id="searchClear"
            aria-label="검색어 지우기"
            hidden
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="m6 6 12 12M18 6 6 18" />
            </svg>
          </button>
        </div>

        <!-- 4. 데일리 브리핑 배너 (캐러셀) -->
        <section class="briefing" aria-label="데일리 브리핑">
          <div class="briefing__track" id="briefingTrack"><!-- JS 렌더 --></div>
          <div class="briefing__dots" id="briefingDots"></div>
        </section>

        <!-- 공유 피드 -->
        <section class="feed">
          <div class="feed__head">
            <h2 class="feed__title">공유 피드</h2>
            <a href="./feed.html" class="feed__more">전체보기 ›</a>
          </div>

          <ul class="cardlist" id="homeFeed"></ul>

          <!-- 판정 유도 배너 -->
          <a href="./judge.html" class="judgecta">
            <span class="judgecta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.6 4.6 5.2v6c0 4.6 3.1 8.9 7.4 10.2 4.3-1.3 7.4-5.6 7.4-10.2v-6L12 2.6Z" />
              </svg>
            </span>
            <span class="judgecta__text">
              <b>더 정확한 판단이 필요하다면?</b>
              닥터저지의 판정을 받아보세요.
            </span>
            <span class="judgecta__btn">판정하기 <span aria-hidden="true">›</span></span>
          </a>
        </section>
      </div>

      <!-- 하단 탭바 (common.js가 렌더) -->
      <nav class="tabbar" data-active="home"></nav>
    </div>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="home.js"></script>
  </body>
</html>
