<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 오늘의 브리핑</title>
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="home.css" />
    <link rel="stylesheet" href="tabs.css" />
    <link rel="stylesheet" href="judge.css" />
    <link rel="stylesheet" href="feed.css" />
    <link rel="stylesheet" href="briefing.css" />
  </head>
  <body>
    <div class="app tabpage briefingpage">
      <header class="subhead">
        <a href="./home.html" class="subhead__back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m15 5-7 7 7 7" />
          </svg>
        </a>
        <h1 class="subhead__title">오늘의 브리핑</h1>
      </header>

      <div class="scroll-area">
        <!-- 날짜 + 공유 -->
        <div class="bdate">
          <div class="bdate__nav">
            <button type="button" class="bdate__arrow" id="prevDay" aria-label="이전 날짜">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m15 5-7 7 7 7" />
              </svg>
            </button>
            <p class="bdate__label" id="dateLabel"></p>
            <button type="button" class="bdate__arrow" id="nextDay" aria-label="다음 날짜">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m9 5 7 7-7 7" />
              </svg>
            </button>
          </div>

          <button type="button" class="bdate__share" id="shareBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 16 16.5 7.5" /><path d="M9.5 7.5h7v7" />
            </svg>
            브리핑 공유
          </button>
        </div>

        <!-- 카테고리 -->
        <div class="bchips" id="catChips"></div>

        <!-- 요약 브리핑 -->
        <section class="summary">
          <h2 class="summary__title">요약 브리핑</h2>
          <p class="summary__text" id="summaryText"></p>
          <div class="summary__stats" id="summaryStats"></div>
        </section>

        <!-- 브리핑 리스트 -->
        <section class="blist">
          <h2 class="blist__title">브리핑 리스트</h2>
          <ul class="blist__items" id="briefList"></ul>
          <p class="blist__empty" id="briefEmpty" hidden>
            해당 분야의 브리핑이 없어요.
          </p>

          <!-- 판정 유도 -->
          <a href="./judge.html" class="judgecta">
            <span class="judgecta__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.6 4.6 5.2v6c0 4.6 3.1 8.9 7.4 10.2 4.3-1.3 7.4-5.6 7.4-10.2v-6L12 2.6Z" />
              </svg>
            </span>
            <span class="judgecta__text">
              <b>더 정확한 판단이 필요하다면?</b>
              닥터저지의 판정을 받아보세요.
            </span>
            <span class="judgecta__btn">판정하기 <span aria-hidden="true">›</span></span>
          </a>
        </section>
      </div>

      <nav class="tabbar" data-active="home"></nav>
    </div>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="briefing.js"></script>
  </body>
</html>
