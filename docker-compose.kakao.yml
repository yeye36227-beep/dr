# ============================================
# 카카오 · 프론트 주소 보충 파일
#
# 백엔드 최신 이미지(2026-08-19 빌드)가 요구하는 필수 환경변수가
# docker-compose.local.yml 에는 아직 없어서 앱이 부팅 중에 죽습니다.
#   Could not resolve placeholder 'KAKAO_CLIENT_ID'
#   Could not resolve placeholder 'KAKAO_ALLOWED_REDIRECT_URIS'   <- 이번에 새로 생김
#   Could not resolve placeholder 'FRONTEND_BASE_URL'             <- 위를 고치면 다음에 걸림
#
# 원본 파일은 그대로 두고, 이 파일을 함께 얹어서 값만 채웁니다.
#
# 실행:
#   docker compose -f docker-compose.local.yml -f docker-compose.kakao.yml up -d
#
# 아래는 '앱이 뜨게만 하는' 더미값입니다.
# 카카오 로그인만 안 되고 회원가입·로그인·판정·피드는 전부 정상 동작합니다.
# 실제 키를 받으면 KAKAO_CLIENT_ID 값만 바꿔 끼우면 됩니다.
# ============================================

services:
  app:
    environment:
      KAKAO_CLIENT_ID: local-dev-dummy
      KAKAO_CLIENT_SECRET: local-dev-dummy
      KAKAO_REDIRECT_URI: http://localhost:3000/kakao-callback.html

      # 백엔드가 프론트에서 넘어온 redirectUri 를 이 목록과 '글자 하나까지' 비교해서
      # 없으면 거부합니다(kakao_redirect_uri_rejected). 쉼표로 구분합니다.
      # 프론트는 '지금 열려 있는 주소 + kakao-callback.html' 을 자동으로 만들기 때문에
      # 3000(serve.js/serve.py) 과 5500(Live Server) 경우를 모두 넣어 둡니다.
      KAKAO_ALLOWED_REDIRECT_URIS: "http://localhost:3000/kakao-callback.html,http://127.0.0.1:3000/kakao-callback.html,http://localhost:5500/kakao-callback.html,http://127.0.0.1:5500/kakao-callback.html,http://localhost:5500/project/kakao-callback.html,http://127.0.0.1:5500/project/kakao-callback.html"

      # 공유 링크 등에서 앱이 만들어 내는 절대 주소의 기준값입니다.
      FRONTEND_BASE_URL: http://localhost:3000
