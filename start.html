<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 시작하기</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <div class="app auth auth--start">
      <main class="auth__hero">
        <img
          class="auth__character"
          src="./assets/character.png"
          alt="Dr.Judge 캐릭터"
          data-fallback="character"
        />
        <img
          class="auth__wordmark"
          src="./assets/wordmark.png"
          alt="Dr.Judge"
          data-fallback="wordmark"
        />
      </main>

      <footer class="auth__cta">
        <!-- 카카오는 가입과 로그인이 하나입니다. 그래서 '회원가입' 안쪽이 아니라
             첫 화면에 둡니다. 안쪽에 있으면 이미 카카오로 가입한 사람이
             '회원가입'을 눌러야 해서 헷갈립니다. -->
        <button type="button" class="btn btn--block btn--lg btn--kakao" id="kakaoBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3.6c-4.7 0-8.5 2.9-8.5 6.5 0 2.3 1.6 4.4 4 5.6l-.9 3.4c-.1.3.3.5.5.3l4-2.6c.3 0 .6.1.9.1 4.7 0 8.5-2.9 8.5-6.5S16.7 3.6 12 3.6Z" />
          </svg>
          카카오로 계속하기
        </button>
        <p class="auth__hint">처음이면 가입, 이미 있으면 로그인돼요</p>

        <p class="auth__or"><span>또는</span></p>

        <a href="./signup.html" class="btn btn--block btn--lg btn--primary">
          회원가입
        </a>

        <p class="auth__switch">
          이미 계정이 있으신가요?
          <a href="./login.html" class="auth__switch-link">로그인</a>
        </p>
      </footer>
    </div>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="kakao-btn.js"></script>
  </body>
</html>
