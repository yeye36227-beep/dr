<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Dr.Judge · 로그인</title>
    <link rel="icon" type="image/png" href="/assets/app-icon.png" />
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="auth.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="app login">
      <!-- 초록 상단 로고 영역 -->
      <header class="login__hero">
        <img
          class="login__logo"
          src="./assets/logo.png"
          alt=""
          data-fallback="logo"
        />
        <p class="login__wordmark">Dr.Judge</p>
      </header>

      <!-- 흰 시트 -->
      <main class="login__sheet">
        <h1 class="login__title">로그인</h1>

        <form class="login__form" id="loginForm" novalidate>
          <!-- 3 · 3-1. 아이디 -->
          <div class="field" data-field="userId">
            <label class="field__label" for="userId">아이디</label>
            <div class="field__row">
              <input
                type="text"
                id="userId"
                name="userId"
                class="field__input"
                placeholder="아이디를 입력해 주세요"
                autocomplete="username"
                inputmode="text"
              />
            </div>
            <p class="field__error">아이디를 다시 확인해 주세요.</p>
          </div>

          <!-- 4 · 4-1 · 4-2 · 4-3. 비밀번호 -->
          <div class="field" data-field="password">
            <label class="field__label" for="password">비밀번호</label>
            <div class="field__row">
              <input
                type="password"
                id="password"
                name="password"
                class="field__input"
                placeholder="비밀번호를 입력해 주세요"
                autocomplete="current-password"
              />
              <button
                type="button"
                class="field__eye"
                data-toggle="#password"
                aria-label="비밀번호 표시"
                aria-pressed="false"
              >
                <svg
                  class="icon-eye-off"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 9c2.4 3.2 5.4 5 9 5s6.6-1.8 9-5" />
                  <path d="M4.5 12.8 3 15.2" />
                  <path d="M9 14.6 8.2 17.4" />
                  <path d="M15 14.6l.8 2.8" />
                  <path d="M19.5 12.8 21 15.2" />
                </svg>
                <svg
                  class="icon-eye-on"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M2.5 12S6 5.8 12 5.8 21.5 12 21.5 12 18 18.2 12 18.2 2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="3.1" />
                </svg>
              </button>
            </div>
            <p class="field__error">비밀번호를 다시 확인해 주세요.</p>
          </div>

          <!-- 서버 오류 / 네트워크 오류 -->
          <p class="form-alert" id="loginAlert" hidden></p>

          <!-- 5. 로그인 버튼 -->
          <button
            type="submit"
            class="btn btn--block btn--lg login__submit"
            id="loginBtn"
          >
            로그인
          </button>

        <button type="button" class="btn btn--block btn--lg btn--kakao" id="kakaoBtn">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12 3.6c-4.7 0-8.5 2.9-8.5 6.5 0 2.3 1.6 4.4 4 5.6l-.9 3.4c-.1.3.3.5.5.3l4-2.6c.3 0 .6.1.9.1 4.7 0 8.5-2.9 8.5-6.5S16.7 3.6 12 3.6Z" />
          </svg>
          카카오로 계속하기
        </button>


          <!-- 6. 회원가입 이동 -->
          <p class="auth__switch login__signup">
            계정이 없으신가요?
            <a href="./signup.html" class="auth__switch-link">회원가입</a>
          </p>
        </form>
      </main>
    </div>

    <script src="common.js"></script>
    <script src="store.js"></script>
    <script src="data.js"></script>
    <script src="api.js"></script>
    <script src="validate.js"></script>
    <script src="login.js"></script>
    <script src="kakao-btn.js"></script>
  </body>
</html>
